name: Test write_output_files feature
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git user and create file changes
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          # Record the current HEAD as base
          BASE_SHA=$(git rev-parse HEAD)
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "Base SHA: $BASE_SHA"

          echo "output file test content $(date +%s)" > output-test-file.txt
          git add -f output-test-file.txt
          git commit -m "Add test file for write_output_files test"

          # Record the new HEAD
          CURRENT_SHA=$(git rev-parse HEAD)
          echo "CURRENT_SHA=$CURRENT_SHA" >> "$GITHUB_ENV"
          echo "Current SHA: $CURRENT_SHA"

      - id: changed
        uses: .
        with:
          base_sha: ${{ env.BASE_SHA }}
          sha: ${{ env.CURRENT_SHA }}
          skip_initial_fetch: "true"
          write_output_files: "true"
          output_dir: ".github/outputs"

      - name: Assert output files were written
        env:
          ALL_CHANGED: ${{ steps.changed.outputs.all_changed_files }}
        run: |
          echo "all_changed_files: $ALL_CHANGED"
          OUTPUT_DIR="$GITHUB_WORKSPACE/.github/outputs"
          echo "Checking output directory: $OUTPUT_DIR"
          ls -la "$OUTPUT_DIR" || true

          # Check that output files were created
          if [ -d "$OUTPUT_DIR" ]; then
            echo "PASS: output directory exists"
          else
            echo "FAIL: output directory $OUTPUT_DIR was not created"
            exit 1
          fi

          # Check for at least one .txt output file
          TXT_COUNT=$(find "$OUTPUT_DIR" -name "*.txt" | wc -l)
          echo "Found $TXT_COUNT .txt output files"
          if [ "$TXT_COUNT" -gt "0" ]; then
            echo "PASS: output .txt files were written"
          else
            echo "FAIL: no .txt output files found in $OUTPUT_DIR"
            exit 1
          fi

          # Verify the added_files output file contains our test file
          ADDED_FILE="$OUTPUT_DIR/added_files.txt"
          if [ -f "$ADDED_FILE" ]; then
            echo "Content of added_files.txt:"
            cat "$ADDED_FILE"
            if grep -q "output-test-file.txt" "$ADDED_FILE"; then
              echo "PASS: output-test-file.txt found in added_files.txt"
            else
              echo "FAIL: output-test-file.txt not found in added_files.txt"
              exit 1
            fi
          else
            echo "FAIL: added_files.txt not found in $OUTPUT_DIR"
            exit 1
          fi
