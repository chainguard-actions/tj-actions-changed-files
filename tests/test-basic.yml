name: Test basic usage - detect changed files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git user and create commits
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          # Record the current HEAD as base
          BASE_SHA=$(git rev-parse HEAD)
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "Base SHA: $BASE_SHA"

          # Create a new file and force-add it (bypasses .gitignore)
          echo "test content $(date +%s)" > test-changed-file.txt
          git add -f test-changed-file.txt
          git commit -m "Add test file for changed-files detection"

          # Record the new HEAD as current
          CURRENT_SHA=$(git rev-parse HEAD)
          echo "CURRENT_SHA=$CURRENT_SHA" >> "$GITHUB_ENV"
          echo "Current SHA: $CURRENT_SHA"

      - id: changed
        uses: .
        with:
          base_sha: ${{ env.BASE_SHA }}
          sha: ${{ env.CURRENT_SHA }}
          skip_initial_fetch: "true"

      - name: Assert outputs are set
        env:
          ALL_CHANGED: ${{ steps.changed.outputs.all_changed_files }}
          ANY_CHANGED: ${{ steps.changed.outputs.any_changed }}
          ALL_MODIFIED: ${{ steps.changed.outputs.all_modified_files }}
          ALL_MODIFIED_COUNT: ${{ steps.changed.outputs.all_modified_files_count }}
        run: |
          echo "all_changed_files: $ALL_CHANGED"
          echo "any_changed: $ANY_CHANGED"
          echo "all_modified_files: $ALL_MODIFIED"
          echo "all_modified_files_count: $ALL_MODIFIED_COUNT"

          if [ -z "$ALL_MODIFIED_COUNT" ]; then
            echo "FAIL: all_modified_files_count output is not set"
            exit 1
          fi
          echo "PASS: outputs are set, all_modified_files_count=$ALL_MODIFIED_COUNT"

      - name: Assert newly added file is detected
        env:
          ADDED_FILES: ${{ steps.changed.outputs.added_files }}
          ADDED_COUNT: ${{ steps.changed.outputs.added_files_count }}
        run: |
          echo "added_files: $ADDED_FILES"
          echo "added_files_count: $ADDED_COUNT"
          if echo "$ADDED_FILES" | grep -q "test-changed-file.txt"; then
            echo "PASS: newly added file detected in added_files"
          else
            echo "FAIL: expected test-changed-file.txt in added_files but got: $ADDED_FILES"
            exit 1
          fi
