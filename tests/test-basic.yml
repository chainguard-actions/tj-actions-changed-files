name: Test basic changed files detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF_NAME: act-harness
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Get base and head SHAs from existing history
        id: shas
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          # Use HEAD~1 as base if it exists, otherwise use HEAD itself with skip_same_sha
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            BASE_SHA=$(git rev-parse HEAD~1)
          else
            BASE_SHA=$HEAD_SHA
          fi
          echo "head_sha=$HEAD_SHA" >> $GITHUB_OUTPUT
          echo "base_sha=$BASE_SHA" >> $GITHUB_OUTPUT
          echo "Head SHA: $HEAD_SHA"
          echo "Base SHA: $BASE_SHA"

      - id: changed
        uses: .
        with:
          base_sha: ${{ steps.shas.outputs.base_sha }}
          sha: ${{ steps.shas.outputs.head_sha }}
          skip_initial_fetch: "true"
          skip_same_sha: "true"

      - name: Assert all_changed_and_modified_files_count is numeric
        env:
          ALL_COUNT: ${{ steps.changed.outputs.all_changed_and_modified_files_count }}
        run: |
          echo "all_changed_and_modified_files_count: $ALL_COUNT"
          if ! echo "$ALL_COUNT" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected a numeric count, got: $ALL_COUNT"
            exit 1
          fi
          echo "PASS: count is numeric: $ALL_COUNT"

      - name: Assert any_changed output is true or false
        env:
          ANY_CHANGED: ${{ steps.changed.outputs.any_changed }}
        run: |
          echo "any_changed: $ANY_CHANGED"
          if [ "$ANY_CHANGED" != "true" ] && [ "$ANY_CHANGED" != "false" ]; then
            echo "FAIL: expected 'true' or 'false', got: $ANY_CHANGED"
            exit 1
          fi
          echo "PASS: any_changed=$ANY_CHANGED"

      - name: Assert all_modified_files_count is numeric
        env:
          MOD_COUNT: ${{ steps.changed.outputs.all_modified_files_count }}
        run: |
          echo "all_modified_files_count: $MOD_COUNT"
          if ! echo "$MOD_COUNT" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected a numeric count, got: $MOD_COUNT"
            exit 1
          fi
          echo "PASS: all_modified_files_count=$MOD_COUNT"
