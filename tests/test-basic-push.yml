name: Test basic push scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a test commit so there is a diff
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "test file" > test-changed-file.txt
          git add test-changed-file.txt
          git commit -m "Add test file"

      - id: changed
        uses: .
        with:
          separator: " "
          fetch_depth: "25"
          since_last_remote_commit: "false"
          safe_output: "true"

      - name: Assert outputs are set
        env:
          ALL_CHANGED: ${{ steps.changed.outputs.all_changed_files }}
          ANY_CHANGED: ${{ steps.changed.outputs.any_changed }}
          ALL_MODIFIED: ${{ steps.changed.outputs.all_modified_files }}
          ADDED_COUNT: ${{ steps.changed.outputs.added_files_count }}
        run: |
          echo "all_changed_files: $ALL_CHANGED"
          echo "any_changed: $ANY_CHANGED"
          echo "all_modified_files: $ALL_MODIFIED"
          echo "added_files_count: $ADDED_COUNT"
          if [ -z "$ALL_CHANGED" ] && [ "$ANY_CHANGED" != "true" ]; then
            echo "WARN: no changed files detected (may be expected in shallow clone)"
          fi
          echo "PASS: action completed successfully"
