name: Test changed-files with explicit base_sha
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Get SHAs from existing git history
        id: setup
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Get the last two commits to use as base and head
          COMMITS=$(git log --format="%H" -n 2)
          HEAD_SHA=$(echo "$COMMITS" | head -n 1)
          BASE_SHA=$(echo "$COMMITS" | tail -n 1)
          if [ -z "$HEAD_SHA" ] || [ -z "$BASE_SHA" ]; then
            echo "ERROR: could not get two commits from git log"
            exit 1
          fi
          if [ "$HEAD_SHA" = "$BASE_SHA" ]; then
            echo "ERROR: repository has only one commit, cannot test diff"
            exit 1
          fi
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "Head SHA: $HEAD_SHA"
          echo "Base SHA: $BASE_SHA"
          echo "Files changed between base and head:"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true

      - name: Run with explicit base_sha and sha
        id: changed
        uses: .
        with:
          base_sha: ${{ steps.setup.outputs.base_sha }}
          sha: ${{ steps.setup.outputs.head_sha }}
          skip_initial_fetch: "true"
        env:
          GITHUB_REF_NAME: act-harness

      - name: Assert outputs are set when using explicit base_sha
        env:
          ALL_CHANGED: ${{ steps.changed.outputs.all_changed_files }}
          ALL_CHANGED_COUNT: ${{ steps.changed.outputs.all_changed_files_count }}
          ALL_MODIFIED: ${{ steps.changed.outputs.all_modified_files }}
          ALL_MODIFIED_COUNT: ${{ steps.changed.outputs.all_modified_files_count }}
          ADDED_COUNT: ${{ steps.changed.outputs.added_files_count }}
          MODIFIED_COUNT: ${{ steps.changed.outputs.modified_files_count }}
          DELETED_COUNT: ${{ steps.changed.outputs.deleted_files_count }}
          BASE_SHA: ${{ steps.setup.outputs.base_sha }}
          HEAD_SHA: ${{ steps.setup.outputs.head_sha }}
        run: |
          echo "base_sha: $BASE_SHA"
          echo "head_sha: $HEAD_SHA"
          echo "all_changed_files: $ALL_CHANGED"
          echo "all_changed_files_count: $ALL_CHANGED_COUNT"
          echo "all_modified_files: $ALL_MODIFIED"
          echo "all_modified_files_count: $ALL_MODIFIED_COUNT"
          echo "added_files_count: $ADDED_COUNT"
          echo "modified_files_count: $MODIFIED_COUNT"
          echo "deleted_files_count: $DELETED_COUNT"

          # Count outputs should always be set (even if 0)
          if [ -z "$ALL_CHANGED_COUNT" ]; then
            echo "FAIL: all_changed_files_count is not set"
            exit 1
          fi
          echo "PASS: all_changed_files_count is set: $ALL_CHANGED_COUNT"

          if [ -z "$ALL_MODIFIED_COUNT" ]; then
            echo "FAIL: all_modified_files_count is not set"
            exit 1
          fi
          echo "PASS: all_modified_files_count is set: $ALL_MODIFIED_COUNT"

          if [ -z "$ADDED_COUNT" ]; then
            echo "FAIL: added_files_count is not set"
            exit 1
          fi
          echo "PASS: added_files_count is set: $ADDED_COUNT"

          if [ -z "$MODIFIED_COUNT" ]; then
            echo "FAIL: modified_files_count is not set"
            exit 1
          fi
          echo "PASS: modified_files_count is set: $MODIFIED_COUNT"

          if [ -z "$DELETED_COUNT" ]; then
            echo "FAIL: deleted_files_count is not set"
            exit 1
          fi
          echo "PASS: deleted_files_count is set: $DELETED_COUNT"

          echo "PASS: explicit base_sha test completed successfully"
