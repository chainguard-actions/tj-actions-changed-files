name: Test base_sha comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF_NAME: act-harness
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Get base and head SHAs from existing history
        id: shas
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          # Use HEAD~1 as base if it exists
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            BASE_SHA=$(git rev-parse HEAD~1)
          else
            BASE_SHA=$HEAD_SHA
          fi
          echo "head_sha=$HEAD_SHA" >> $GITHUB_OUTPUT
          echo "base_sha=$BASE_SHA" >> $GITHUB_OUTPUT
          echo "Head SHA: $HEAD_SHA"
          echo "Base SHA: $BASE_SHA"

      - id: changed
        uses: .
        with:
          base_sha: ${{ steps.shas.outputs.base_sha }}
          sha: ${{ steps.shas.outputs.head_sha }}
          skip_initial_fetch: "true"
          skip_same_sha: "true"

      - name: Assert count outputs are numeric
        env:
          ADDED_COUNT: ${{ steps.changed.outputs.added_files_count }}
          ALL_COUNT: ${{ steps.changed.outputs.all_changed_and_modified_files_count }}
        run: |
          echo "added_files_count: $ADDED_COUNT"
          echo "all_changed_and_modified_files_count: $ALL_COUNT"
          if ! echo "$ADDED_COUNT" | grep -qE '^[0-9]+$'; then
            echo "FAIL: added_files_count is not numeric: $ADDED_COUNT"
            exit 1
          fi
          if ! echo "$ALL_COUNT" | grep -qE '^[0-9]+$'; then
            echo "FAIL: all_changed_and_modified_files_count is not numeric: $ALL_COUNT"
            exit 1
          fi
          echo "PASS: count outputs are numeric"

      - name: Assert all_changed_and_modified_files output is a string
        env:
          ALL_CHANGED: ${{ steps.changed.outputs.all_changed_and_modified_files }}
          ALL_COUNT: ${{ steps.changed.outputs.all_changed_and_modified_files_count }}
        run: |
          echo "all_changed_and_modified_files: $ALL_CHANGED"
          echo "all_changed_and_modified_files_count: $ALL_COUNT"
          # If count > 0, files should be non-empty
          if [ "$ALL_COUNT" -gt 0 ] && [ -z "$ALL_CHANGED" ]; then
            echo "FAIL: count is $ALL_COUNT but all_changed_and_modified_files is empty"
            exit 1
          fi
          echo "PASS: outputs are consistent"

      - name: Assert deleted_files_count is numeric
        env:
          DEL_COUNT: ${{ steps.changed.outputs.deleted_files_count }}
        run: |
          echo "deleted_files_count: $DEL_COUNT"
          if ! echo "$DEL_COUNT" | grep -qE '^[0-9]+$'; then
            echo "FAIL: deleted_files_count is not numeric: $DEL_COUNT"
            exit 1
          fi
          echo "PASS: deleted_files_count=$DEL_COUNT"
