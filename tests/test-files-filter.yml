name: Test files filter - detect changes matching patterns
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git user and create file changes
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          # Record the current HEAD as base
          BASE_SHA=$(git rev-parse HEAD)
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "Base SHA: $BASE_SHA"

          # Create a .md file and a .txt file
          echo "markdown content $(date +%s)" > test-doc.md
          echo "text content $(date +%s)" > test-data.txt
          git add -f test-doc.md test-data.txt
          git commit -m "Add test files for filter test"

          # Record the new HEAD
          CURRENT_SHA=$(git rev-parse HEAD)
          echo "CURRENT_SHA=$CURRENT_SHA" >> "$GITHUB_ENV"
          echo "Current SHA: $CURRENT_SHA"

      - id: changed_md
        uses: .
        with:
          base_sha: ${{ env.BASE_SHA }}
          sha: ${{ env.CURRENT_SHA }}
          skip_initial_fetch: "true"
          files: "*.md"

      - name: Assert only .md files are detected
        env:
          ANY_CHANGED: ${{ steps.changed_md.outputs.any_changed }}
          ALL_CHANGED: ${{ steps.changed_md.outputs.all_changed_files }}
        run: |
          echo "any_changed: $ANY_CHANGED"
          echo "all_changed_files: $ALL_CHANGED"
          if [ "$ANY_CHANGED" != "true" ]; then
            echo "FAIL: expected any_changed=true for *.md filter but got: $ANY_CHANGED"
            exit 1
          fi
          if echo "$ALL_CHANGED" | grep -q "test-doc.md"; then
            echo "PASS: .md file detected"
          else
            echo "FAIL: expected test-doc.md in all_changed_files but got: $ALL_CHANGED"
            exit 1
          fi
          if echo "$ALL_CHANGED" | grep -q "test-data.txt"; then
            echo "FAIL: .txt file should NOT be in all_changed_files for *.md filter"
            exit 1
          fi
          echo "PASS: filter correctly includes .md and excludes .txt"

      - id: changed_txt
        uses: .
        with:
          base_sha: ${{ env.BASE_SHA }}
          sha: ${{ env.CURRENT_SHA }}
          skip_initial_fetch: "true"
          files: "*.txt"

      - name: Assert only .txt files are detected
        env:
          ANY_CHANGED: ${{ steps.changed_txt.outputs.any_changed }}
          ALL_CHANGED: ${{ steps.changed_txt.outputs.all_changed_files }}
        run: |
          echo "any_changed: $ANY_CHANGED"
          echo "all_changed_files: $ALL_CHANGED"
          if [ "$ANY_CHANGED" != "true" ]; then
            echo "FAIL: expected any_changed=true for *.txt filter but got: $ANY_CHANGED"
            exit 1
          fi
          if echo "$ALL_CHANGED" | grep -q "test-data.txt"; then
            echo "PASS: .txt file detected"
          else
            echo "FAIL: expected test-data.txt in all_changed_files but got: $ALL_CHANGED"
            exit 1
          fi
          echo "PASS: *.txt filter works correctly"
