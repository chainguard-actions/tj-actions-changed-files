name: Test sha and base_sha inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create two commits to compare
        id: commits
        run: |
          git config user.email "test@test.com"
          git config user.name "Test"

          # Create base commit
          echo "base-content" > sha-test-base.txt
          git add sha-test-base.txt
          git commit -m "Base commit for sha test"
          BASE_SHA=$(git rev-parse HEAD)
          echo "base_sha=$BASE_SHA" >> $GITHUB_OUTPUT

          # Create head commit
          echo "head-content" > sha-test-head.txt
          git add sha-test-head.txt
          git commit -m "Head commit for sha test"
          HEAD_SHA=$(git rev-parse HEAD)
          echo "head_sha=$HEAD_SHA" >> $GITHUB_OUTPUT

          echo "Base SHA: $BASE_SHA"
          echo "Head SHA: $HEAD_SHA"

      - id: changed
        uses: .
        with:
          sha: ${{ steps.commits.outputs.head_sha }}
          base_sha: ${{ steps.commits.outputs.base_sha }}
          separator: " "
          safe_output: "true"
          fetch_depth: "25"
          skip_initial_fetch: "false"
          since_last_remote_commit: "false"
          write_output_files: "false"
          json: "false"
          escape_json: "true"
          dir_names: "false"
          diff_relative: "true"
          quotepath: "true"
          include_all_old_new_renamed_files: "false"
          old_new_separator: ","
          old_new_files_separator: " "
          fail_on_initial_diff_error: "false"
          fail_on_submodule_diff_error: "false"
          negation_patterns_first: "false"
          matrix: "false"
          exclude_submodules: "false"
          exclude_symlinks: "false"
          skip_same_sha: "false"

      - name: Assert added_files contains the head commit file
        env:
          ADDED: ${{ steps.changed.outputs.added_files }}
          ADDED_COUNT: ${{ steps.changed.outputs.added_files_count }}
        run: |
          echo "added_files: $ADDED"
          echo "added_files_count: $ADDED_COUNT"
          if [ -z "$ADDED_COUNT" ]; then
            echo "FAIL: added_files_count output is empty"
            exit 1
          fi
          if ! echo "$ADDED" | grep -q "sha-test-head.txt"; then
            echo "FAIL: expected sha-test-head.txt in added_files, got: $ADDED"
            exit 1
          fi
          echo "PASS"

      - name: Assert all_changed_files count is set
        env:
          ALL_CHANGED_COUNT: ${{ steps.changed.outputs.all_changed_files_count }}
        run: |
          echo "all_changed_files_count: $ALL_CHANGED_COUNT"
          if [ -z "$ALL_CHANGED_COUNT" ]; then
            echo "FAIL: all_changed_files_count output is empty"
            exit 1
          fi
          echo "PASS"

      - name: Cleanup test files
        if: always()
        run: |
          rm -f sha-test-base.txt sha-test-head.txt || true
