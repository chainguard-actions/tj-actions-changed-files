name: Test dir_names and dir_names_max_depth inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git and create nested directory commits
        id: setup
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

          # Record the base SHA
          BASE_SHA=$(git rev-parse HEAD)
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

          # Create a nested directory structure and commit
          mkdir -p test-dir/level1/level2
          echo "content" > test-dir/level1/level2/file.txt
          git add test-dir/
          git commit -m "Add nested test directory for dir_names test"

          # Record the new HEAD SHA
          HEAD_SHA=$(git rev-parse HEAD)
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - id: changed
        uses: .
        with:
          sha: ${{ steps.setup.outputs.head_sha }}
          base_sha: ${{ steps.setup.outputs.base_sha }}
          dir_names: "true"
          dir_names_max_depth: "2"
          dir_names_exclude_current_dir: "false"
          dir_names_deleted_files_include_only_deleted_dirs: "false"
          dir_names_include_files: ""
          dir_names_include_files_separator: "\n"
          separator: " "
          safe_output: "true"
          fetch_depth: "25"
          json: "false"
          escape_json: "true"
          quotepath: "true"
          diff_relative: "true"
          write_output_files: "false"
          output_dir: ".github/outputs"
          use_rest_api: "false"
          fail_on_initial_diff_error: "false"
          fail_on_submodule_diff_error: "false"
          negation_patterns_first: "false"
          matrix: "false"
          exclude_submodules: "false"
          fetch_missing_history_max_retries: "20"
          use_posix_path_separator: "false"
          tags_pattern: "*"
          tags_ignore_pattern: ""
          skip_initial_fetch: "false"
          fetch_additional_submodule_history: "false"
          since_last_remote_commit: "false"
          include_all_old_new_renamed_files: "false"
          old_new_separator: ","
          old_new_files_separator: " "
          output_renamed_files_as_deleted_and_added: "false"
          recover_deleted_files: "false"
          recover_deleted_files_to_destination: ""
          recover_files: ""
          recover_files_separator: "\n"
          recover_files_ignore: ""
          recover_files_ignore_separator: "\n"

      - name: Assert dir_names output respects max_depth of 2
        env:
          ALL_CHANGED: ${{ steps.changed.outputs.all_changed_files }}
          ALL_MODIFIED: ${{ steps.changed.outputs.all_modified_files }}
          ADDED_FILES: ${{ steps.changed.outputs.added_files }}
        run: |
          echo "all_changed_files (dirs): $ALL_CHANGED"
          echo "all_modified_files (dirs): $ALL_MODIFIED"
          echo "added_files (dirs): $ADDED_FILES"

          # With dir_names=true and max_depth=2, the path test-dir/level1/level2/file.txt
          # should be reported as test-dir/level1 (depth 2), not test-dir/level1/level2
          for dir in $ALL_CHANGED; do
            depth=$(echo "$dir" | tr -cd '/' | wc -c)
            echo "Checking dir: $dir (depth: $depth)"
            if [ "$depth" -gt 1 ]; then
              echo "FAIL: directory '$dir' exceeds max_depth of 2 (has $((depth+1)) components)"
              exit 1
            fi
          done
          echo "PASS: all directory outputs respect max_depth=2"
