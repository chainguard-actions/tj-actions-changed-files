name: Test dir_names output mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git and create commits in subdirectories
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

          BASE_SHA=$(git rev-parse HEAD)
          echo "BASE_SHA=$BASE_SHA" >> $GITHUB_ENV

          # Create files in a specific subdirectory
          mkdir -p tests/tmp-dir-test/subdir-a
          mkdir -p tests/tmp-dir-test/subdir-b
          echo "content a" > tests/tmp-dir-test/subdir-a/file.txt
          echo "content b" > tests/tmp-dir-test/subdir-b/file.txt

          git add tests/tmp-dir-test/
          git commit -m "Add files in subdirectories for dir_names test"

          HEAD_SHA=$(git rev-parse HEAD)
          echo "HEAD_SHA=$HEAD_SHA" >> $GITHUB_ENV

      - id: changed_dirs
        uses: .
        with:
          base_sha: ${{ env.BASE_SHA }}
          sha: ${{ env.HEAD_SHA }}
          dir_names: "true"

      - name: Assert dir_names output contains directory paths
        env:
          ALL_CHANGED: ${{ steps.changed_dirs.outputs.all_changed_files }}
          ALL_CHANGED_COUNT: ${{ steps.changed_dirs.outputs.all_changed_files_count }}
        run: |
          echo "all_changed_files (dirs): $ALL_CHANGED"
          echo "all_changed_files_count: $ALL_CHANGED_COUNT"

          if [ -z "$ALL_CHANGED" ]; then
            echo "FAIL: expected non-empty dir output"
            exit 1
          fi
          echo "PASS: dir output is non-empty"

          # Should contain directory paths, not individual files
          # The output should contain 'subdir-a' or 'subdir-b' or their parent
          if echo "$ALL_CHANGED" | grep -qE "subdir-[ab]|tmp-dir-test"; then
            echo "PASS: directory names found in output"
          else
            echo "FAIL: expected directory names in output, got: $ALL_CHANGED"
            exit 1
          fi

          # Verify count is set
          if [ -z "$ALL_CHANGED_COUNT" ] || [ "$ALL_CHANGED_COUNT" -lt 1 ]; then
            echo "FAIL: expected all_changed_files_count >= 1, got: $ALL_CHANGED_COUNT"
            exit 1
          fi
          echo "PASS: count=$ALL_CHANGED_COUNT"

      - name: Clean up test files
        if: always()
        run: |
          git rm -rf tests/tmp-dir-test/ 2>/dev/null || true
          git commit -m "Cleanup dir_names test files" 2>/dev/null || true
