name: Test JSON output format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git identity
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create a base commit
        run: |
          echo "file one" > tests/json-test-file1.txt
          git add tests/json-test-file1.txt
          git commit -m "Add json-test-file1.txt"

      - name: Add another file in the next commit
        run: |
          echo "file two" > tests/json-test-file2.txt
          git add tests/json-test-file2.txt
          git commit -m "Add json-test-file2.txt"

      - id: changed
        uses: .
        with:
          fetch_depth: "2"
          json: "true"
          escape_json: "false"

      - name: Assert all_changed_files is valid JSON array
        env:
          ALL_CHANGED: ${{ steps.changed.outputs.all_changed_files }}
        run: |
          echo "all_changed_files (JSON): $ALL_CHANGED"
          if [ -z "$ALL_CHANGED" ]; then
            echo "FAIL: all_changed_files output is empty"
            exit 1
          fi
          # Validate it's valid JSON
          if echo "$ALL_CHANGED" | python3 -c "import sys, json; data = json.load(sys.stdin); print('parsed ok, items:', len(data))" 2>/dev/null; then
            echo "PASS: all_changed_files is valid JSON"
          else
            echo "FAIL: all_changed_files is not valid JSON: $ALL_CHANGED"
            exit 1
          fi

      - name: Assert added_files is valid JSON array
        env:
          ADDED: ${{ steps.changed.outputs.added_files }}
        run: |
          echo "added_files (JSON): $ADDED"
          if [ -z "$ADDED" ]; then
            echo "FAIL: added_files output is empty"
            exit 1
          fi
          if echo "$ADDED" | python3 -c "import sys, json; data = json.load(sys.stdin); print('parsed ok, items:', len(data))" 2>/dev/null; then
            echo "PASS: added_files is valid JSON"
          else
            echo "FAIL: added_files is not valid JSON: $ADDED"
            exit 1
          fi

      - name: Assert added_files JSON contains our file
        env:
          ADDED: ${{ steps.changed.outputs.added_files }}
        run: |
          echo "added_files: $ADDED"
          if echo "$ADDED" | grep -q "json-test-file2.txt"; then
            echo "PASS: json-test-file2.txt found in added_files JSON"
          else
            echo "FAIL: json-test-file2.txt not found in added_files JSON"
            exit 1
          fi
