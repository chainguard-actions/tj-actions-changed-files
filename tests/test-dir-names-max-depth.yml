name: Test dir_names_max_depth input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create nested directory structure and commit changes
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          mkdir -p deep/level1/level2/level3
          echo "test content" > deep/level1/level2/level3/file.txt
          git add deep/level1/level2/level3/file.txt
          git commit -m "Add deeply nested file for dir_names_max_depth test"

      - id: changed
        uses: .
        with:
          dir_names: "true"
          dir_names_max_depth: "2"
          since_last_remote_commit: "false"
          base_sha: HEAD~1

      - name: Assert dir_names output is non-empty
        env:
          ALL_MODIFIED: ${{ steps.changed.outputs.all_modified_files }}
        run: |
          echo "all_modified_files: $ALL_MODIFIED"
          if [ -z "$ALL_MODIFIED" ]; then
            echo "FAIL: expected non-empty all_modified_files output"
            exit 1
          fi
          echo "PASS: got modified files output: $ALL_MODIFIED"

      - name: Assert max depth is respected (no path deeper than 2 levels)
        env:
          ALL_MODIFIED: ${{ steps.changed.outputs.all_modified_files }}
        run: |
          echo "all_modified_files: $ALL_MODIFIED"
          # With dir_names_max_depth=2, we expect at most "deep/level1" not "deep/level1/level2"
          for dir in $ALL_MODIFIED; do
            depth=$(echo "$dir" | tr -cd '/' | wc -c)
            echo "dir: $dir, depth (slashes): $depth"
            if [ "$depth" -gt 1 ]; then
              echo "FAIL: directory '$dir' exceeds max depth of 2 (more than 1 slash)"
              exit 1
            fi
          done
          echo "PASS: all directories are within max depth of 2"
